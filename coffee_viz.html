<title>Cavalier Coffee Sales Dashboard</title>
<style>
  :root {
    --primary: #8b6f47;
    --primary-light: #a5896d;
    --accent: #d4a574;
    --chart-bg: #faf8f3;
    --text: #2c2c2c;
    --text-muted: #666;
    --border: #e0dbd5;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --primary: #d4a574;
      --primary-light: #e8c49e;
      --accent: #a5896d;
      --chart-bg: #2a2620;
      --text: #f0ede8;
      --text-muted: #999;
      --border: #3d3833;
    }
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    background: var(--chart-bg);
    max-width: 1200px;
    margin: 0 auto;
    padding: 2rem 1rem;
  }

  h1, h2 {
    color: var(--primary);
    margin: 1.5rem 0 0.5rem;
  }

  h1 {
    font-size: 1.8rem;
    text-align: center;
  }

  .subtitle {
    text-align: center;
    color: var(--text-muted);
    margin-bottom: 2rem;
    font-size: 0.95rem;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2rem;
    margin-bottom: 2rem;
  }

  @media (max-width: 768px) {
    .grid {
      grid-template-columns: 1fr;
    }
  }

  .card {
    background: rgba(255, 255, 255, 0.5);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1.5rem;
  }

  @media (prefers-color-scheme: dark) {
    .card {
      background: rgba(42, 38, 32, 0.5);
    }
  }

  .chart-container {
    height: 350px;
    position: relative;
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1rem;
    margin-top: 2rem;
  }

  @media (max-width: 768px) {
    .stats {
      grid-template-columns: repeat(2, 1fr);
    }
  }

  .stat {
    background: rgba(139, 111, 71, 0.1);
    border-left: 3px solid var(--primary);
    padding: 1rem;
    border-radius: 4px;
  }

  .stat-value {
    font-size: 1.5rem;
    font-weight: 600;
    color: var(--primary);
  }

  .stat-label {
    font-size: 0.85rem;
    color: var(--text-muted);
    margin-top: 0.25rem;
  }
</style>

<h1>☕ Cavalier Coffee Sales</h1>
<p class="subtitle">September - October 2026 Performance Analysis</p>

<div class="grid">
  <div class="card">
    <h2>Revenue by Location</h2>
    <div class="chart-container" id="location-chart"></div>
  </div>

  <div class="card">
    <h2>Revenue by Day of Week</h2>
    <div class="chart-container" id="day-chart"></div>
  </div>
</div>

<div class="stats">
  <div class="stat">
    <div class="stat-value">$151.7K</div>
    <div class="stat-label">Total Revenue</div>
  </div>
  <div class="stat">
    <div class="stat-value">34.3K</div>
    <div class="stat-label">Total Cups Sold</div>
  </div>
  <div class="stat">
    <div class="stat-value">$4.42</div>
    <div class="stat-label">Avg Price/Cup</div>
  </div>
  <div class="stat">
    <div class="stat-value">Clemons</div>
    <div class="stat-label">Top Location</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.26.0/plotly.min.js"></script>
<script>
  // Revenue by Location
  const locationData = [{
    x: ['Clemons', 'Rotunda', 'Rice Hall', 'AFC Gym'],
    y: [51904.30, 38102.50, 30836.94, 25661.37],
    type: 'bar',
    marker: {
      color: ['#8b6f47', '#a5896d', '#d4a574', '#c19860']
    },
    hovertemplate: '<b>%{x}</b><br>Revenue: $%{y:,.2f}<extra></extra>'
  }];

  const locationLayout = {
    plot_bgcolor: 'rgba(0,0,0,0)',
    paper_bgcolor: 'rgba(0,0,0,0)',
    font: { color: 'var(--text)' },
    margin: { l: 60, r: 20, t: 20, b: 60 },
    yaxis: { title: 'Revenue (USD)', gridcolor: 'rgba(128, 128, 128, 0.2)' },
    showlegend: false,
    hovermode: 'closest'
  };

  Plotly.newPlot('location-chart', locationData, locationLayout, { responsive: true });

  // Revenue by Day of Week
  const dayOrder = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
  const dayRevenue = [22809.44, 23142.69, 22893.76, 21379.95, 22935.73, 24315.29, 14245.37];

  const dayData = [{
    x: dayOrder,
    y: dayRevenue,
    type: 'bar',
    marker: {
      color: dayRevenue.map(v => v > 24000 ? '#8b6f47' : v < 20000 ? '#d4a574' : '#a5896d')
    },
    hovertemplate: '<b>%{x}</b><br>Revenue: $%{y:,.2f}<extra></extra>'
  }];

  const dayLayout = {
    plot_bgcolor: 'rgba(0,0,0,0)',
    paper_bgcolor: 'rgba(0,0,0,0)',
    font: { color: 'var(--text)' },
    margin: { l: 60, r: 20, t: 20, b: 60 },
    yaxis: { title: 'Revenue (USD)', gridcolor: 'rgba(128, 128, 128, 0.2)' },
    showlegend: false,
    hovermode: 'closest'
  };

  Plotly.newPlot('day-chart', dayData, dayLayout, { responsive: true });
</script>
